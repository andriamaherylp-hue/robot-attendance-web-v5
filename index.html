<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>UptimeRobot Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ===================== RESET & BASE ===================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:         #0d0f14;
  --bg2:        #151820;
  --bg3:        #1c1f2a;
  --bg4:        #232736;
  --border:     rgba(255,255,255,0.07);
  --border2:    rgba(255,255,255,0.12);
  --text:       #e8eaf0;
  --text2:      #8b90a0;
  --text3:      #555b6e;
  --green:      #22d37a;
  --green-bg:   rgba(34,211,122,0.1);
  --green-b:    rgba(34,211,122,0.25);
  --red:        #f04e5e;
  --red-bg:     rgba(240,78,94,0.1);
  --red-b:      rgba(240,78,94,0.25);
  --amber:      #f5a623;
  --amber-bg:   rgba(245,166,35,0.1);
  --amber-b:    rgba(245,166,35,0.25);
  --blue:       #4d9fff;
  --blue-bg:    rgba(77,159,255,0.1);
  --blue-b:     rgba(77,159,255,0.25);
  --purple:     #a78bfa;
  --purple-bg:  rgba(167,139,250,0.1);
  --accent:     #22d37a;
  --radius:     10px;
  --radius-lg:  14px;
  --radius-xl:  18px;
}
html { font-size: 15px; }
body {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}
button { cursor: pointer; font-family: inherit; }
input  { font-family: inherit; }

/* ===================== SCROLLBAR ===================== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* ===================== TOPBAR ===================== */
.topbar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(13,15,20,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
}
.logo-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #22d37a, #4d9fff);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.topbar-center { display: flex; align-items: center; gap: 6px; }
.topbar-right  { display: flex; align-items: center; gap: 12px; }

.tab-pill {
  display: flex; background: var(--bg3);
  border: 1px solid var(--border); border-radius: 999px; padding: 3px; gap: 2px;
}
.tab-pill button {
  padding: 5px 16px; border: none; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  background: transparent; color: var(--text2);
  transition: all 0.18s;
}
.tab-pill button.active {
  background: var(--bg4); color: var(--text);
  box-shadow: 0 1px 4px rgba(0,0,0,0.4);
}

.live-indicator {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text2);
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

.refresh-btn {
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.refresh-btn:hover { background: var(--bg4); color: var(--text); }
.refresh-btn.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===================== LAYOUT ===================== */
.app-shell { display: flex; min-height: calc(100vh - 60px); }

/* Sidebar */
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 16px 10px;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.sidebar-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
  color: var(--text3); text-transform: uppercase;
  padding: 8px 10px 4px;
}
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius);
  cursor: pointer; transition: background 0.15s;
  border: 1px solid transparent;
}
.user-row:hover   { background: var(--bg3); }
.user-row.active  { background: var(--bg3); border-color: var(--border2); }
.user-avatar {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; flex-shrink: 0;
}
.user-row-info { flex: 1; min-width: 0; }
.user-row-name {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-row-id { font-size: 11px; color: var(--text3); }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.dot-present { background: var(--green); }
.dot-pause   { background: var(--amber); }
.dot-absent  { background: var(--text3); }

/* Main content */
.main-content { flex: 1; overflow-y: auto; padding: 24px 28px; }

/* ===================== SECTION TITLE ===================== */
.section-title {
  font-size: 11px; font-weight: 600; letter-spacing: 0.09em;
  color: var(--text3); text-transform: uppercase; margin-bottom: 12px;
}

/* ===================== PROFILE HEADER ===================== */
.profile-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 20px 24px;
  margin-bottom: 20px;
}
.profile-left { display: flex; align-items: center; gap: 16px; }
.profile-avatar {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
}
.profile-name { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 2px; }
.profile-uid  { font-size: 12px; color: var(--text3); font-family: monospace; }
.profile-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
}
.badge-present { background: var(--green-bg); border: 1px solid var(--green-b); color: var(--green); }
.badge-pause   { background: var(--amber-bg); border: 1px solid var(--amber-b); color: var(--amber); }
.badge-absent  { background: var(--bg4);      border: 1px solid var(--border);  color: var(--text3); }
.last-update   { font-size: 11px; color: var(--text3); }

/* ===================== METRICS GRID ===================== */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px; margin-bottom: 20px;
}
.metric-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 14px 16px;
  position: relative; overflow: hidden;
}
.metric-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; border-radius: 2px 2px 0 0;
}
.metric-card.green::before  { background: var(--green); }
.metric-card.red::before    { background: var(--red); }
.metric-card.amber::before  { background: var(--amber); }
.metric-card.blue::before   { background: var(--blue); }
.metric-card.purple::before { background: var(--purple); }
.metric-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 6px;
}
.metric-value { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.metric-sub   { font-size: 11px; color: var(--text3); margin-top: 3px; }
.metric-value.green  { color: var(--green); }
.metric-value.red    { color: var(--red); }
.metric-value.amber  { color: var(--amber); }
.metric-value.blue   { color: var(--blue); }
.metric-value.purple { color: var(--purple); }

/* ===================== TWO-COL ===================== */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }

/* ===================== INFO CARD ===================== */
.info-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 18px;
}
.info-card-title {
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 12px;
}
.info-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}
.info-row:last-child { border-bottom: none; }
.info-row-label { font-size: 13px; color: var(--text2); display: flex; align-items: center; gap: 7px; }
.info-row-icon  { font-size: 14px; width: 18px; text-align: center; }
.info-row-val   { font-size: 13px; font-weight: 500; }
.val-green { color: var(--green); }
.val-red   { color: var(--red); }
.val-amber { color: var(--amber); }

/* ===================== PAUSE CARDS ===================== */
.pause-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
}
.pause-item {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px;
}
.pause-item-header {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text2); margin-bottom: 6px;
}
.pause-item-emoji { font-size: 14px; }
.pause-count { font-size: 18px; font-weight: 700; }
.pause-dur   { font-size: 11px; color: var(--text3); margin-top: 1px; }

/* ===================== ACTIVE BREAK BANNER ===================== */
.break-banner {
  background: var(--amber-bg); border: 1px solid var(--amber-b);
  border-radius: var(--radius-lg); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.break-banner-left { display: flex; align-items: center; gap: 10px; }
.break-banner-emoji { font-size: 20px; }
.break-banner-label { font-size: 13px; font-weight: 600; color: var(--amber); }
.break-banner-since { font-size: 11px; color: var(--text2); margin-top: 1px; }
.break-banner-right { font-size: 12px; color: var(--text3); }
.overdue { color: var(--red); font-weight: 600; }

/* ===================== SESSIONS TABLE ===================== */
.sessions-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.sessions-table th {
  text-align: left; padding: 6px 8px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text3);
  border-bottom: 1px solid var(--border);
}
.sessions-table td {
  padding: 8px 8px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.sessions-table tr:last-child td { border-bottom: none; }
.sessions-table tr:hover td { background: rgba(255,255,255,0.02); }
.exceeded-pill {
  display: inline-block; padding: 1px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 600;
  background: var(--red-bg); border: 1px solid var(--red-b); color: var(--red);
}
.ok-pill {
  display: inline-block; padding: 1px 7px; border-radius: 999px;
  font-size: 10px; font-weight: 600;
  background: var(--green-bg); border: 1px solid var(--green-b); color: var(--green);
}

/* ===================== MONTHLY ===================== */
.monthly-metrics {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr));
  gap: 10px; margin-bottom: 20px;
}
.chart-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 20px;
}
.chart-card-title {
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 14px;
}
.chart-wrap { position: relative; width: 100%; height: 200px; }
.monthly-table-wrap {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
}
.monthly-table-header {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text3);
}
.monthly-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
}
.monthly-table th {
  padding: 8px 14px; text-align: left;
  font-size: 10px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text3);
  border-bottom: 1px solid var(--border); background: var(--bg3);
}
.monthly-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
}
.monthly-table tr:last-child td { border-bottom: none; }
.monthly-table tr:hover td { background: rgba(255,255,255,0.02); }

/* ===================== EMPTY / ERROR STATES ===================== */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px; color: var(--text3); gap: 12px;
}
.empty-icon { font-size: 40px; }
.empty-text { font-size: 14px; }

.error-banner {
  background: var(--red-bg); border: 1px solid var(--red-b);
  border-radius: var(--radius); padding: 10px 14px;
  font-size: 13px; color: var(--red); margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}

/* ===================== API CONFIG ===================== */
.config-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 6px 10px;
}
.config-bar input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-size: 12px; font-family: monospace;
  width: 260px;
}
.config-bar input::placeholder { color: var(--text3); }
.config-bar-label { font-size: 11px; color: var(--text3); white-space: nowrap; }
.apply-btn {
  padding: 4px 12px; border-radius: 6px;
  background: var(--accent); color: #000; font-size: 12px; font-weight: 600;
  border: none; transition: opacity 0.15s;
}
.apply-btn:hover { opacity: 0.85; }

/* ===================== OFF WORK PANEL ===================== */
.offwork-panel { border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border); margin-bottom: 18px; }
.offwork-panel-header { padding: 14px 20px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.offwork-panel-title { font-size: 14px; font-weight: 600; }
.offwork-panel-date  { font-size: 12px; color: var(--text3); margin-left: auto; font-family: monospace; }
.offwork-cols { display: grid; grid-template-columns: 1fr 1fr; min-height: 160px; }
.offwork-col  { padding: 16px 18px; }
.offwork-col:first-child { border-right: 1px solid var(--border); }
.offwork-col-title { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
.col-ok    { color: var(--green); }
.col-alert { color: var(--red); }
.offwork-emp-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius); margin-bottom: 5px; background: var(--bg3); border: 1px solid var(--border); }
.offwork-emp-row.ok-row    { border-color: var(--green-b); background: var(--green-bg); }
.offwork-emp-row.alert-row { border-color: var(--red-b);   background: var(--red-bg); }
.offwork-emp-avatar { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.offwork-emp-name { font-size: 12px; font-weight: 500; }
.offwork-emp-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.offwork-emp-badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.badge-ok    { background: var(--green-bg); border: 1px solid var(--green-b); color: var(--green); }
.badge-alert { background: var(--red-bg);   border: 1px solid var(--red-b);   color: var(--red); }
.offwork-empty { font-size: 12px; color: var(--text3); padding: 10px 0; font-style: italic; }

/* ===================== CALENDAR ===================== */
.calendar-wrap { margin-bottom: 18px; }
.calendar-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.calendar-nav-title { font-size: 14px; font-weight: 600; flex: 1; text-align: center; }
.cal-nav-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text2); font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.14s; }
.cal-nav-btn:hover { background: var(--bg4); color: var(--text); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-day-header { text-align: center; font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); padding: 6px 0; }
.cal-day { aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: all 0.13s; position: relative; min-height: 44px; }
.cal-day.empty { cursor: default; }
.cal-day.other-month { opacity: 0.3; }
.cal-day:not(.empty):hover { border-color: var(--border2); background: var(--bg3); }
.cal-day.selected { border-color: var(--accent) !important; background: rgba(34,211,122,0.07) !important; }
.cal-day.today .cal-day-num { color: var(--accent); font-weight: 700; }
.cal-day-num { font-size: 13px; font-weight: 500; line-height: 1; }
.cal-day-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 3px; }
.cal-day.day-present { background: rgba(34,211,122,0.06); border-color: rgba(34,211,122,0.15); }
.cal-day.day-absent  { background: rgba(240,78,94,0.05);  border-color: rgba(240,78,94,0.12); }
.cal-day.day-offwork { background: rgba(77,159,255,0.05); border-color: rgba(77,159,255,0.12); }
.cal-day.day-weekend { opacity: 0.4; }
.dot-present-c { background: var(--green); }
.dot-absent-c  { background: var(--red); }
.dot-offwork-c { background: var(--amber); }
.cal-detail { margin-top: 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
.cal-detail-date { font-size: 13px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.cal-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 8px; }
.cal-detail-stat { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 12px; }
.cal-detail-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; }
.cal-detail-stat-val   { font-size: 15px; font-weight: 700; margin-top: 2px; }

/* ===================== LEGEND ===================== */
.legend-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 11px; color: var(--text3); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot  { width: 9px; height: 9px; border-radius: 50%; }

/* ===================== SUB TABS ===================== */
.sub-tab-bar { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
.sub-tab-btn { padding: 7px 16px; border: none; background: transparent; font-size: 13px; font-weight: 500; color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.14s; }
.sub-tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.sub-tab-btn:hover  { color: var(--text2); }

/* ===================== MONTHLY METRICS ===================== */
.monthly-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; margin-bottom: 18px; }

/* ===================== RESPONSIVE ===================== */
@media (max-width: 900px) {
  .sidebar    { width: 220px; }
  .two-col    { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .sidebar    { display: none; }
  .main-content { padding: 16px; }
  .topbar     { padding: 0 16px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ===================== UTILS =====================
function fmtSec(totalSec) {
  if (!totalSec || totalSec <= 0) return "0min";
  const s = Math.round(totalSec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sc = s % 60;
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}min`;
  if (m > 0 && sc > 0) return `${m}min ${sc}s`;
  if (m > 0) return `${m}min`;
  return `${sc}s`;
}

function fmtHM(totalSec) {
  if (!totalSec || totalSec <= 0) return "0h00";
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  return `${h}h${String(m).padStart(2,'0')}`;
}

function BreakBanner({ pause_courante }) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t+1), 1000);
    return () => clearInterval(id);
  }, []);

  if (!pause_courante) return null;
  const { type, elapsed, limit, exceeded } = pause_courante;
  const info  = BREAK_LABELS[type] || { label: "Pause", emoji: "⏸" };
  const live  = elapsed + tick;
  const over  = live - limit;

  return (
    <div className="break-banner">
      <div className="break-banner-left">
        <div className="break-banner-emoji">{info.emoji}</div>
        <div>
          <div className="break-banner-label">{info.label} en cours</div>
          <div className="break-banner-since">Écoulé : {fmtSec(live)} / Limite : {fmtSec(limit)}</div>
        </div>
      </div>
      <div className="break-banner-right">
        {exceeded || over > 0
          ? <span className="overdue">⚠ +{fmtSec(Math.max(over,0))} dépassé</span>
          : <span>Restant : {fmtSec(Math.max(limit-live,0))}</span>
        }
      </div>
    </div>
  );
}

// ===================== DEMO HISTORY (par employé) =====================
function makeDemoHistory(userId) {
  const today = new Date();
  const year  = today.getFullYear();
  const month = today.getMonth();
  const days  = new Date(year, month+1, 0).getDate();
  const history = {};
  for (let d = 1; d <= days; d++) {
    const dt = new Date(year, month, d);
    if (dt > today) break;
    const dow = dt.getDay();
    if (dow === 0 || dow === 6) continue;
    const seed = (userId * 13 + d * 7) % 100;
    const absent = seed < 12;
    if (absent) {
      history[`${year}-${padZ(month+1)}-${padZ(d)}`] = { statut: "absent" };
    } else {
      const retardMin = seed < 25 ? Math.floor((seed % 5) * 3 + 1) : 0;
      const depassSec = seed > 70 ? (seed % 3 + 1) * 120 : 0;
      const offWorkDone = dt.getDate() < today.getDate() || (dt.getDate() === today.getDate() && today.getHours() >= 18);
      history[`${year}-${padZ(month+1)}-${padZ(d)}`] = {
        statut:            offWorkDone ? "offwork" : "present",
        heure_arrivee:     retardMin > 0 ? `07:${padZ(40+retardMin)}` : "07:38",
        heure_depart:      offWorkDone ? "18:27" : "--:--",
        retard_min:        retardMin,
        depassements_sec:  depassSec,
        temps_effectif_sec: Math.max(0, 38700 - depassSec - retardMin * 60),
      };
    }
  }
  return history;
}

function MonthlyChart({ data }) {
  const ref = useRef(null);
  const chartRef = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    const labels = data.map(r => r.date);
    const vals   = data.map(r => r.heures);
    const colors = data.map(r => r.statut === "present" || r.statut === "offwork"
      ? "rgba(34,211,122,0.65)" : "rgba(240,78,94,0.35)");
    chartRef.current = new Chart(ref.current, {
      type: "bar",
      data: { labels, datasets: [{ label:"Heures", data:vals, backgroundColor:colors, borderRadius:4, borderSkipped:false }] },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins: { legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw}h`}} },
        scales: {
          x: { grid:{display:false}, ticks:{color:"#555b6e",font:{size:10}} },
          y: { min:0, max:12, ticks:{color:"#555b6e",font:{size:10},callback:v=>`${v}h`}, grid:{color:"rgba(255,255,255,0.04)"} }
        }
      }
    });
    return () => { if(chartRef.current) chartRef.current.destroy(); };
  }, [data]);
  return <canvas ref={ref} aria-label="Graphique des heures de travail journalières" />;
}

function CalendarView({ emp, colorIdx, history }) {
  const today   = new Date();
  const [viewYear,  setViewYear]  = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selDay,    setSelDay]    = useState(null);

  function prevMonth() {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y-1); }
    else setViewMonth(m => m-1);
    setSelDay(null);
  }
  function nextMonth() {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y+1); }
    else setViewMonth(m => m+1);
    setSelDay(null);
  }

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startDow = firstDay.getDay() - 1;
  if (startDow < 0) startDow = 6;
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const daysInPrev  = new Date(viewYear, viewMonth,   0).getDate();

  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ day: daysInPrev - i, month: 'prev' });
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${viewYear}-${padZ(viewMonth+1)}-${padZ(d)}`;
    const dt = new Date(viewYear, viewMonth, d);
    const dow = dt.getDay();
    cells.push({ day: d, month: 'cur', dateStr, dt, weekend: dow === 0 || dow === 6 });
  }
  const rem = 42 - cells.length;
  for (let i = 1; i <= rem; i++) cells.push({ day: i, month: 'next' });

  const selectedData = selDay && history ? history[selDay] : null;

  const monthStats = useMemo(() => {
    if (!history) return { presents:0, absents:0, retards:0, totalSec:0 };
    let presents=0, absents=0, retards=0, totalSec=0;
    for (let d=1; d<=daysInMonth; d++) {
      const k = `${viewYear}-${padZ(viewMonth+1)}-${padZ(d)}`;
      const h = history[k];
      if (!h) continue;
      if (h.statut === 'absent') absents++;
      else { presents++; if (h.retard_min>0) retards++; totalSec += (h.temps_effectif_sec||0); }
    }
    return { presents, absents, retards, totalSec };
  }, [history, viewYear, viewMonth, daysInMonth]);

  return (
    <div>
      <div className="monthly-metrics" style={{marginBottom:16}}>
        <div className="metric-card green"><div className="metric-label">Jours présents</div><div className="metric-value green">{monthStats.presents}</div></div>
        <div className="metric-card red"><div className="metric-label">Jours absents</div><div className="metric-value red">{monthStats.absents}</div></div>
        <div className="metric-card amber"><div className="metric-label">Retards</div><div className="metric-value amber">{monthStats.retards}</div></div>
        <div className="metric-card blue"><div className="metric-label">Total heures</div><div className="metric-value blue">{fmtHM(monthStats.totalSec)}</div></div>
      </div>
      <div className="calendar-wrap">
        <div className="calendar-nav">
          <button className="cal-nav-btn" onClick={prevMonth}>‹</button>
          <div className="calendar-nav-title">{MONTHS_FR[viewMonth]} {viewYear}</div>
          <button className="cal-nav-btn" onClick={nextMonth}>›</button>
        </div>
        <div className="legend-row">
          <div className="legend-item"><div className="legend-dot" style={{background:'var(--green)'}}></div>Présent</div>
          <div className="legend-item"><div className="legend-dot" style={{background:'var(--blue)'}}></div>Off Work</div>
          <div className="legend-item"><div className="legend-dot" style={{background:'var(--red)'}}></div>Absent</div>
          <div className="legend-item"><div className="legend-dot" style={{background:'var(--amber)'}}></div>Retard/Dépassement</div>
        </div>
        <div className="calendar-grid">
          {DAYS_FR.map(d => <div key={d} className="cal-day-header">{d}</div>)}
          {cells.map((cell, idx) => {
            if (cell.month !== 'cur') {
              return <div key={idx} className="cal-day empty other-month"><span className="cal-day-num" style={{color:'var(--text3)'}}>{cell.day}</span></div>;
            }
            const isToday  = cell.dt && cell.dt.toDateString() === today.toDateString();
            const isFuture = cell.dt && cell.dt > today;
            const h = history && history[cell.dateStr];
            let dayClass = "cal-day";
            let dotClass = null;
            if (cell.weekend) dayClass += " day-weekend";
            else if (!isFuture && h) {
              if (h.statut === 'absent')  { dayClass += " day-absent";  dotClass = "dot-absent-c"; }
              else if (h.statut === 'offwork') { dayClass += " day-offwork"; dotClass = "dot-offwork-c"; }
              else { dayClass += " day-present"; dotClass = "dot-present-c"; }
              if (h.retard_min > 0 || h.depassements_sec > 0) dotClass = "dot-offwork-c";
            }
            if (isToday) dayClass += " today";
            if (selDay === cell.dateStr) dayClass += " selected";
            return (
              <div key={idx} className={dayClass}
                onClick={() => !cell.weekend && !isFuture && setSelDay(selDay === cell.dateStr ? null : cell.dateStr)}>
                <span className="cal-day-num">{cell.day}</span>
                {dotClass && !isFuture && !cell.weekend && <div className={`cal-day-dot ${dotClass}`}></div>}
              </div>
            );
          })}
        </div>
        {selDay && (
          <div className="cal-detail">
            <div className="cal-detail-date">
              <span style={{fontSize:18}}>{selectedData ? (selectedData.statut==='absent' ? '❌' : selectedData.retard_min>0||selectedData.depassements_sec>0 ? '⚠️' : '✅') : '📅'}</span>
              {new Date(selDay+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
            </div>
            {!selectedData ? (
              <div style={{color:'var(--text3)',fontSize:13}}>Aucune donnée pour cette journée.</div>
            ) : selectedData.statut === 'absent' ? (
              <div style={{color:'var(--red)',fontSize:13}}>⛔ Employé absent ce jour-là.</div>
            ) : (
              <div className="cal-detail-grid">
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Arrivée</div><div className="cal-detail-stat-val" style={{color:'var(--green)',fontFamily:'monospace'}}>{selectedData.heure_arrivee||'--:--'}</div></div>
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Départ</div><div className="cal-detail-stat-val" style={{color:'var(--blue)',fontFamily:'monospace'}}>{selectedData.heure_depart||'--:--'}</div></div>
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Retard</div><div className="cal-detail-stat-val" style={{color:selectedData.retard_min>0?'var(--red)':'var(--green)'}}>{selectedData.retard_min>0?`+${selectedData.retard_min} min`:'Aucun'}</div></div>
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Dépassements</div><div className="cal-detail-stat-val" style={{color:selectedData.depassements_sec>0?'var(--amber)':'var(--green)'}}>{selectedData.depassements_sec>0?fmtSec(selectedData.depassements_sec):'Aucun'}</div></div>
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Travail effectif</div><div className="cal-detail-stat-val" style={{color:'var(--blue)'}}>{fmtHM(selectedData.temps_effectif_sec)}</div></div>
                <div className="cal-detail-stat"><div className="cal-detail-stat-label">Statut</div><div className="cal-detail-stat-val" style={{fontSize:13}}>{selectedData.statut==='offwork'?<span style={{color:'var(--blue)'}}>✔ Off Work</span>:<span style={{color:'var(--green)'}}>● Présent</span>}</div></div>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ===================== EMPLOYEE MONTHLY VIEW =====================
function EmployeeMonthlyView({ emp, colorIdx, history }) {
  const [subTab, setSubTab] = useState("calendar");
  const today = new Date();
  const viewYear  = today.getFullYear();
  const viewMonth = today.getMonth();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  const rows = useMemo(() => {
    const r = [];
    for (let d=1; d<=daysInMonth; d++) {
      const dt  = new Date(viewYear, viewMonth, d);
      if (dt > today) continue;
      const dow = dt.getDay();
      if (dow === 0 || dow === 6) continue;
      const k = `${viewYear}-${padZ(viewMonth+1)}-${padZ(d)}`;
      const h = history && history[k];
      r.push({
        date:   `${padZ(d)}/${padZ(viewMonth+1)}`,
        arrivee: h ? (h.heure_arrivee||'--:--') : '--:--',
        depart:  h ? (h.heure_depart||'--:--')  : '--:--',
        travail: h && h.temps_effectif_sec ? fmtHM(h.temps_effectif_sec) : '--',
        heures:  h && h.temps_effectif_sec ? Math.round(h.temps_effectif_sec/360)/10 : 0,
        retard:  h ? (h.retard_min||0) : 0,
        depass:  h ? (h.depassements_sec||0) : 0,
        statut:  h ? h.statut : 'absent',
      });
    }
    return r;
  }, [history, viewYear, viewMonth, daysInMonth]);

  return (
    <div>
      <div className="sub-tab-bar">
        <button className={`sub-tab-btn ${subTab==='calendar'?'active':''}`} onClick={()=>setSubTab('calendar')}>📅 Calendrier</button>
        <button className={`sub-tab-btn ${subTab==='chart'?'active':''}`}    onClick={()=>setSubTab('chart')}>📊 Graphique</button>
        <button className={`sub-tab-btn ${subTab==='table'?'active':''}`}    onClick={()=>setSubTab('table')}>📋 Tableau</button>
      </div>
      {subTab === 'calendar' && <CalendarView emp={emp} colorIdx={colorIdx} history={history} />}
      {subTab === 'chart' && (
        <div className="chart-card">
          <div className="chart-card-title">Heures travaillées — {MONTHS_FR[viewMonth]} {viewYear}</div>
          <div style={{display:"flex",gap:14,marginBottom:10,fontSize:11,color:"var(--text3)"}}>
            <span><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:"rgba(34,211,122,0.65)",marginRight:4}}></span>Présent</span>
            <span><span style={{display:"inline-block",width:10,height:10,borderRadius:2,background:"rgba(240,78,94,0.35)",marginRight:4}}></span>Absent</span>
          </div>
          <div className="chart-wrap"><MonthlyChart data={rows} /></div>
        </div>
      )}
      {subTab === 'table' && (
        <div className="monthly-table-wrap">
          <div className="monthly-table-header">
            <span>Détail journalier — {MONTHS_FR[viewMonth]} {viewYear}</span>
            <span style={{fontSize:11,color:'var(--text3)'}}>{rows.filter(r=>r.statut!=='absent').length} jours ouvrés</span>
          </div>
          <table className="monthly-table">
            <thead>
              <tr><th>Date</th><th>Arrivée</th><th>Départ</th><th>Durée</th><th>Retard</th><th>Dépassements</th><th>Statut</th></tr>
            </thead>
            <tbody>
              {rows.map((r,i) => (
                <tr key={i}>
                  <td style={{fontWeight:500}}>{r.date}</td>
                  <td style={{fontFamily:'monospace'}}>{r.arrivee}</td>
                  <td style={{fontFamily:'monospace'}}>{r.depart}</td>
                  <td>{r.travail}</td>
                  <td>{r.retard > 0 ? <span className="exceeded-pill">+{r.retard}min</span> : <span className="ok-pill">—</span>}</td>
                  <td>{r.depass > 0 ? <span className="exceeded-pill">+{fmtSec(r.depass)}</span> : <span className="ok-pill">—</span>}</td>
                  <td>
                    {r.statut==='offwork' ? <span className="ok-pill" style={{background:'var(--blue-bg)',borderColor:'var(--blue-b)',color:'var(--blue)'}}>Off Work</span>
                     : r.statut!=='absent' ? <span className="ok-pill">Présent</span>
                     : <span className="exceeded-pill">Absent</span>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

// ===================== APP =====================
const DEFAULT_API = (typeof window !== "undefined" ? window.location.origin : "") + "/api/stats";

function App() {
  const [tab,       setTab]       = useState("daily");
  const [apiUrl,    setApiUrl]    = useState(DEFAULT_API);
  const [inputUrl,  setInputUrl]  = useState(DEFAULT_API);
  const [data,      setData]      = useState(null);       // null = pas encore chargé
  const [loading,   setLoading]   = useState(true);
  const [error,     setError]     = useState(null);
  const [isDemo,    setIsDemo]    = useState(false);
  const [selIdx,    setSelIdx]    = useState(0);
  const apiEverOk  = React.useRef(false);                 // API a répondu au moins 1 fois

  const employes = data?.employes || [];
  const selected = employes[selIdx] || employes[0];

  // Couleur indexée par user_id pour le panel Off Work
  const colorMap = useMemo(() => {
    const m = {};
    employes.forEach((e, i) => { m[e.user_id] = avatarColor(i); });
    return m;
  }, [employes]);

  // Historiques mensuels (simulés en démo, vides en live — à brancher sur une vraie API mensuelle)
  const [histories, setHistories] = useState({});
  useEffect(() => {
    if (isDemo && employes.length > 0) {
      const h = {};
      employes.forEach(e => { h[e.user_id] = makeDemoHistory(e.user_id); });
      setHistories(h);
    }
  }, [isDemo, data]);

  const fetchData = useCallback(async (url) => {
    setLoading(true);
    setError(null);
    try {
      const controller = new AbortController();
      const tid = setTimeout(() => controller.abort(), 9000);
      const res = await fetch(url, { cache: "no-store", signal: controller.signal });
      clearTimeout(tid);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      // API OK → mode live, même si liste vide (bot vient de démarrer)
      apiEverOk.current = true;
      setData(json);
      setIsDemo(false);
    } catch (e) {
      const reason = e.name === "AbortError"
        ? "délai dépassé — vérifiez que le bot Render est actif"
        : e.message;
      setError(`API inaccessible : ${reason}`);
      // Bascule en démo uniquement si on n'a jamais eu de données réelles
      if (!apiEverOk.current) {
        setData(makeDemoData());
        setIsDemo(true);
      }
    } finally {
      setLoading(false);
    }
  }, []);

  // Auto-fetch au chargement initial
  useEffect(() => {
    fetchData(apiUrl);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Auto-refresh toutes les 15 secondes
  useEffect(() => {
    const id = setInterval(() => fetchData(apiUrl), 15000);
    return () => clearInterval(id);
  }, [apiUrl, fetchData]);

  const handleApply = () => {
    setApiUrl(inputUrl);
    fetchData(inputUrl);
  };

  return (
    <div>
      {/* TOPBAR */}
      <div className="topbar">
        <div className="logo">
          <div className="logo-icon">⏱</div>
          UptimeRobot Attendance
        </div>
        <div className="topbar-center">
          <div className="tab-pill">
            <button className={tab==="daily"  ?"active":""} onClick={()=>setTab("daily")}>Quotidien</button>
            <button className={tab==="results"?"active":""} onClick={()=>setTab("results")}>Résultats</button>
            <button className={tab==="monthly"?"active":""} onClick={()=>setTab("monthly")}>Mensuel</button>
          </div>
        </div>
        <div className="topbar-right">
          <div className="live-indicator">
            <div className="live-dot" />
            {isDemo ? "Démo" : "En direct"}
          </div>
          <button
            className={`refresh-btn ${loading ? "spin" : ""}`}
            onClick={() => fetchData(apiUrl)}
            title="Rafraîchir"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
          </button>
        </div>
      </div>

      <div className="app-shell">
        {/* SIDEBAR */}
        <div className="sidebar">
          {/* API config */}
          <div style={{padding:"0 4px 12px"}}>
            <div className="section-title">URL de l'API bot</div>
            <div className="config-bar" style={{flexDirection:"column",alignItems:"stretch",gap:6}}>
              <input
                value={inputUrl}
                onChange={e => setInputUrl(e.target.value)}
                placeholder="https://votre-bot.onrender.com/api/stats"
                onKeyDown={e => e.key === "Enter" && handleApply()}
              />
              <button className="apply-btn" onClick={handleApply}>Connecter →</button>
            </div>
            {isDemo && (
              <div style={{fontSize:10,color:"var(--text3)",marginTop:6,padding:"0 2px"}}>
                Mode démonstration — configurez l'URL de votre bot ci-dessus
              </div>
            )}
          </div>

          <div className="sidebar-label">Employés ({employes.length})</div>
          {employes.map((e, i) => {
            const ac = avatarColor(i);
            return (
              <div
                key={e.user_id}
                className={`user-row ${selIdx===i?"active":""}`}
                onClick={() => setSelIdx(i)}
              >
                <div className="user-avatar" style={{background:ac.bg,color:ac.color}}>
                  {initials(e.nom)}
                </div>
                <div className="user-row-info">
                  <div className="user-row-name">{e.nom}</div>
                  <div className="user-row-id">#{e.user_id}</div>
                </div>
                <div className={`status-dot ${e.statut==="present"?"dot-present":e.statut==="pause"?"dot-pause":"dot-absent"}`}/>
              </div>
            );
          })}
        </div>

        {/* MAIN */}
        <div className="main-content">
          {/* Bannière erreur */}
          {error && (
            <div className="error-banner">⚠ {error}</div>
          )}

          {/* Chargement initial (data === null) */}
          {data === null && loading && (
            <div className="empty-state">
              <div className="empty-icon" style={{animation:"spin 1s linear infinite",display:"inline-block"}}>↻</div>
              <div className="empty-text">Connexion à l'API du bot…</div>
            </div>
          )}

          {/* API connectée mais aucun employé n'a encore pointé */}
          {data !== null && !isDemo && employes.length === 0 && (
            <div className="empty-state">
              <div className="empty-icon">🟢</div>
              <div className="empty-text" style={{textAlign:'center'}}>
                Bot connecté — en attente des pointages.<br/>
                <span style={{fontSize:12,color:'var(--text3)'}}>Les employés apparaîtront ici dès qu'ils appuieront sur 🟢 Start Work.</span>
              </div>
            </div>
          )}

          {/* QUOTIDIEN */}
          {tab === "daily" && selected && <DailyView emp={selected} colorIdx={selIdx} />}
          {tab === "daily" && !selected && data !== null && employes.length === 0 && !loading && (
            <div className="empty-state"><div className="empty-icon">👥</div><div className="empty-text">Aucun employé actif</div></div>
          )}

          {/* RÉSULTATS DU JOUR */}
          {tab === "results" && (
            <div>
              <OffWorkPanel employes={employes} colorMap={colorMap} />
              <div className="monthly-table-wrap">
                <div className="monthly-table-header">
                  <span>Récapitulatif du jour — Tous les employés</span>
                </div>
                <table className="monthly-table">
                  <thead>
                    <tr>
                      <th>Employé</th><th>Statut</th><th>Arrivée</th><th>Départ</th>
                      <th>Travail net</th><th>Retard</th><th>Dépassements</th><th>Pauses</th>
                    </tr>
                  </thead>
                  <tbody>
                    {employes.map((e, i) => {
                      const ac = avatarColor(i);
                      return (
                        <tr key={e.user_id} onClick={()=>{setSelIdx(i);setTab('daily');}} style={{cursor:'pointer'}}>
                          <td>
                            <div style={{display:'flex',alignItems:'center',gap:8}}>
                              <div style={{width:26,height:26,borderRadius:7,background:ac.bg,color:ac.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}}>
                                {initials(e.nom)}
                              </div>
                              <span style={{fontWeight:500}}>{e.nom}</span>
                            </div>
                          </td>
                          <td>
                            {e.statut==="present" ? <span className="ok-pill">Présent</span>
                             : e.statut==="pause"  ? <span className="ok-pill" style={{background:'var(--amber-bg)',borderColor:'var(--amber-b)',color:'var(--amber)'}}>En pause</span>
                             : <span className="exceeded-pill">Absent</span>}
                          </td>
                          <td style={{fontFamily:'monospace'}}>{e.heure_arrivee}</td>
                          <td style={{fontFamily:'monospace'}}>{e.heure_depart}</td>
                          <td>{e.temps_effectif_sec > 0 ? fmtHM(e.temps_effectif_sec) : '—'}</td>
                          <td>{e.retard_min > 0 ? <span className="exceeded-pill">+{e.retard_min}min</span> : <span className="ok-pill">—</span>}</td>
                          <td>{e.depassements_sec > 0 ? <span className="exceeded-pill">+{fmtSec(e.depassements_sec)}</span> : <span className="ok-pill">—</span>}</td>
                          <td style={{color:'var(--text3)'}}>{e.departs_temporaires.count}× · {fmtSec(e.pauses_total_sec)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* MENSUEL (par employé sélectionné) */}
          {tab === "monthly" && selected && (
            <div>
              <div className="profile-header" style={{marginBottom:18}}>
                <div className="profile-left">
                  <div className="profile-avatar" style={{background:avatarColor(selIdx).bg,color:avatarColor(selIdx).color}}>
                    {initials(selected.nom)}
                  </div>
                  <div>
                    <div className="profile-name">{selected.nom}</div>
                    <div className="profile-uid">Suivi mensuel · ID {selected.user_id}</div>
                  </div>
                </div>
                <div className="profile-right">
                  <StatusBadge statut={selected.statut} />
                </div>
              </div>
              <EmployeeMonthlyView
                emp={selected}
                colorIdx={selIdx}
                history={histories[selected.user_id] || {}}
              />
            </div>
          )}
          {tab === "monthly" && !selected && data !== null && (
            <div className="empty-state"><div className="empty-icon">📅</div><div className="empty-text">Sélectionnez un employé dans la barre latérale</div></div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
